---
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please-action:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      run_job_release: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          release-type: python
          target-branch: ${{ github.ref_name }}
          token: ${{ secrets.CI_GITHUB_PAT }}

  release:
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    needs:
      - release-please-action
    if: always() && ((success() && needs.release-please-action.outputs.run_job_release == 'true') || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
